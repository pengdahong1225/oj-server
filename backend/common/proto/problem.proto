syntax = "proto3";
option go_package = "./;pb";

import "google/protobuf/empty.proto";

// 题目服务接口
service ProblemService {
  rpc CreateProblem(CreateProblemRequest) returns (CreateProblemResponse);
  rpc PublishProblem(PublishProblemRequest) returns (google.protobuf.Empty);
  rpc HideProblem(HideProblemRequest) returns (google.protobuf.Empty);
  rpc UpdateProblem(UpdateProblemRequest) returns (google.protobuf.Empty);
  rpc DeleteProblem(DeleteProblemRequest) returns (google.protobuf.Empty);
  rpc GetTagList(google.protobuf.Empty) returns (GetTagListResponse);
  rpc GetProblemList(GetProblemListRequest) returns (GetProblemListResponse);
  rpc GetProblemDetail(GetProblemRequest) returns (GetProblemResponse);
  rpc GetProblemConfig(GetProblemConfigRequest) returns (GetProblemConfigResponse);
  rpc SubmitProblem(SubmitProblemRequest) returns (SubmitProblemResponse);
  rpc ValidateProblems(ValidateProblemsRequest) returns (google.protobuf.Empty);
}

// 题目基础信息
message Problem{
  int64 id = 1;
  int64 create_at = 2;
  int64  update_at = 3;
  string delete_at = 4;

  string title = 5;
  int32 level = 6;
  repeated string tags = 7;
  int32 status = 8;
}
// 题目配置信息
message ProblemConfig{
  int64 id = 1;
  Limit compile_limit = 2;
  Limit run_limit = 3;
  repeated TestCase test_cases = 4;
}
message Limit{
  int64 cpu_limit = 1;    // CPU时间限制，单位纳秒
  int64 clock_limit = 2;  // 等待时间限制，单位纳秒 （通常为 cpuLimit 两倍）
  int64 memory_limit = 3; // 内存限制，单位 byte
  int64 stack_limit = 4;  // 栈内存限制，单位 byte
  int64 proc_limit = 5;   // 线程数量限制，默认50
}
message TestCase{
  string input = 1;
  string output = 2;
}

// “提交”状态枚举，如果没有查询到状态，就意味着最近没有提交题目or题目提交过期了
enum SubmitState{
  UPStateNormal = 0;        // 初始状态
  UPStateCompiling = 1;     // 正在编译
  UPStateJudging = 2;       // 已编译成功，正在判题
  UPStateExited = 3;        // 已退出 -> 如何查询到这个状态，意味着可以查询结果了
}

// 提交信息
message JudgeSubmission{
  int64 problem_id = 1;
  string title = 2;
  string lang = 3;
  string code = 4;
  int64 uid = 5;
  string config_url = 6;
  string task_id = 7;
  int32 level = 8;
  string user_name = 9;
  string problem_name = 10;
}

// 判题结果
message JudgeResult{
  repeated JudgeResultItem items = 1;
  int64 uid = 2;
  int64 problem_id = 3;
  bool accepted = 4;
  string message = 5;
  string code = 6;
  string lang = 7;
  string task_id = 8;
  int32 level = 9;
  string user_name = 10;
  string problem_name = 11;
}

message JudgeResultItem{
  // api返回字段
  string status = 1;
  string err_msg = 2;                // 详细错误信息
  int64 exitStatus = 3;              // 程序返回值
  int64 time = 4;                    // 程序运行 CPU 时间，单位纳秒
  int64 memory = 5;                  // 程序运行内存，单位 byte
  int64 runTime = 6;                 // 程序运行现实时间，单位纳秒
  // 其他字段
  string content = 7;
  TestCase testCase = 8;
}
message JudgeResultStore {
  repeated JudgeResultItem items = 1;
}


// 新增题目
message CreateProblemRequest {
  string title = 1;
  int32 level = 2;
  repeated string tags = 3;
}
message CreateProblemResponse {
  int64 id = 1;
}

// 发布题目
message PublishProblemRequest {
  int64 id = 1;
}

// 隐藏题目
message HideProblemRequest {
  int64 id = 1;
}

// 更新题目
message UpdateProblemRequest {
  Problem data = 1;
}

// 删除题目
message DeleteProblemRequest {
  int64 id = 1;
}

// 查询题目列表
// 使用偏移量分页
message GetProblemListRequest {
  int32 page = 1;
  int32 page_size = 2;
  string keyword = 3;
  string tag = 4;
}
message GetProblemListResponse {
  int64 total = 1;
  repeated Problem data = 2;
}

// 获取题目详情
message GetProblemRequest{
  int64 id = 1;
}
message GetProblemResponse{
  Problem problem = 1;
}

// 获取题目配置
message GetProblemConfigRequest{
  int64 id = 1;
}
message GetProblemConfigResponse{
  ProblemConfig problem_config = 1;
}

// tags
message GetTagListResponse {
  repeated string data = 1;
}

// 提交
message SubmitProblemRequest {
  int64 problem_id = 1;
  string title = 2;
  string lang = 3;
  string code = 4;
}
message SubmitProblemResponse {
  string task_id = 1;
}

// 校验题目
message ValidateProblemsRequest {
  repeated int64 problem_ids = 1;
}