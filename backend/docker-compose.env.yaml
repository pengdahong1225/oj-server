version: '3'

networks:
  oj:
    name: oj
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

services:
  # ============================ consul 集群 ============================
  consul-server-01:
    image: consul:1.15.4
    container_name: consul-server-01
    command: "agent -server -client=0.0.0.0 -node=consul01 -ui -bootstrap-expect=3"
    restart: always
    volumes:
      - /data/oj/consul/consul01:/consul/data
    networks:
      - oj
    ports:
      - "8500:8500"
      - "8600:8600/tcp"
      - "8600:8600/udp"

  consul-server-02:
    image: consul:1.15.4
    container_name: consul-server-02
    command: "agent -server -client=0.0.0.0 -node=consul02 -ui -retry-join=consul-server-01"
    restart: always
    volumes:
      - /data/oj/consul/consul02:/consul/data
    networks:
      - oj
    ports:
      - "8501:8500"

  consul-server-03:
    image: consul:1.15.4
    container_name: consul-server-03
    command: "agent -server -client=0.0.0.0 -node=consul03 -ui -retry-join=consul-server-01"
    restart: always
    volumes:
      - /data/oj/consul/consul03:/consul/data
    networks:
      - oj
    ports:
      - "8502:8500"

  consul-client:
    image: consul:1.15.4
    container_name: consul-client
    command: "agent -client=0.0.0.0 -node=consul-client -retry-join=consul-server-01"
    restart: always
    networks:
      - oj

  # ============================ mysql ============================
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: '1225@PDH'
      MYSQL_DATABASE: oj_online_server
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - /data/oj/mysql:/var/lib/mysql
      - ./.mysql-init/user.sql:/docker-entrypoint-initdb.d/01-user.sql:ro
      - ./.mysql-init/problem.sql:/docker-entrypoint-initdb.d/02-problem.sql:ro
      - ./.mysql-init/record.sql:/docker-entrypoint-initdb.d/03-record.sql:ro
      - ./.mysql-init/commet.sql:/docker-entrypoint-initdb.d/04-commet.sql:ro
      - ./.mysql-init/notice.sql:/docker-entrypoint-initdb.d/05-notice.sql:ro
    networks:
      - oj
    ports:
      - "3306:3306"

  # ============================ redis ============================
  redis:
    image: redis:7
    container_name: redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /data/oj/redis:/data
    networks:
      - oj
    ports:
      - "6379:6379"

  # ============================ rabbitmq ============================
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /oj
    volumes:
      - /data/oj/rabbitmq:/var/lib/rabbitmq
    networks:
      - oj
    ports:
      - "5672:5672"
      - "15672:15672"
