user nginx;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {
	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	client_max_body_size 200m;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##
	# include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;

	# nginx 启动时不解析上游域名
	resolver 127.0.0.11 valid=10s ipv6=off;

	server {
		listen 80;
		server_name 192.168.2.145;
		location / {
			root /usr/share/nginx/html/dist;
			index index.html;
		}

		# 反向代理后端 API，解决跨域
		location /api/ {
			# 用变量形式：启动时不解析域名，请求时才解析
			set $gateway_upstream http://gateway-service:9000;
			proxy_pass $gateway_upstream;
			# 关键：设置跨域相关响应头，允许浏览器接收
			add_header Access-Control-Allow-Origin $http_origin; # 允许请求的源（$http_origin 为动态值,或者为*允许所有的跨域调用）
			add_header Access-Control-Allow-Methods GET,POST,PUT,DELETE,OPTIONS; # 允许的请求方法
			add_header Access-Control-Allow-Headers Content-Type,Authorization; # 允许的请求头
			add_header Access-Control-Allow-Credentials true; # 允许携带 Cookie（需前后端配合）
		}
	}
}
