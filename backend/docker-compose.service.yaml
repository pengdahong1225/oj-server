version: '3'

networks:
  oj:
    external: true

services:
  sandbox-c_cpp:
    image: registry.cn-chengdu.aliyuncs.com/aliyun_pdh_space/judge-sandbox:c_cpp
    container_name: sandbox-c_cpp
    privileged: true
    restart: always
    ports:
      - "5050:5050"
      - "5051:5051"
    networks:
      - oj

  gateway-service:
    container_name: gateway-service
    privileged: true
    build:
      context: ./svr/gateway
      dockerfile: gateway.dockerfile
    volumes:
      - /data/oj/log:/app/log
    ports:
      - "9000:9000"
    networks:
      - oj

  user-service:
    container_name: user-service
    privileged: true
    build:
      context: ./svr/user
      dockerfile: user.dockerfile
    volumes:
      - /data/oj/log:/app/log
    ports:
      - "9010:9010"
    networks:
      - oj

  judge-service:
    container_name: judge-service
    privileged: true
    build:
      context: ./svr/judge
      dockerfile: judge.dockerfile
    volumes:
      - /data/oj/log:/app/log
    ports:
      - "9020:9020"
    networks:
      - oj
    depends_on:
      - sandbox-c_cpp

  problem-service:
    container_name: problem-service
    privileged: true
    build:
      context: ./svr/problem
      dockerfile: problem.dockerfile
    volumes:
      - /data/oj/log:/app/log
    ports:
      - "9030:9030"
    networks:
      - oj

  nginx:
    image: nginx:1.27
    container_name: nginx
    restart: always
    depends_on:
      - gateway-service
    entrypoint: ["/bin/sh", "-c", "mkdir -p /etc/nginx/modules-enabled /etc/nginx/sites-enabled && exec nginx -g 'daemon off;'"]
    volumes:
      - ./oj.nginx.conf:/etc/nginx/nginx.conf:ro
      - /data/oj/log/nginx:/var/log/nginx
      - /data/oj/html/dist:/usr/share/nginx/html/dist 
    networks:
      - oj
    ports:
      - "80:80"
